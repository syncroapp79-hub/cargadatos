<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba Preceptoría</title>
</head>

<body>

<h2>Prueba Cloudflare</h2>

<button onclick="probar()">
  Probar conexión
</button>

<p id="estado"></p>

<script>

const API_URL =
  "PEGAR_ACA_LA_URL_DEL_WORKER";


async function probar() {

  const estado =
    document.getElementById("estado");

  estado.textContent =
    "Conectando...";


  try {

    const respuesta =
      await fetch(API_URL);

    const datos =
      await respuesta.json();


    if (datos.ok) {

      estado.textContent =
        "✅ Conexión correcta con Cloudflare Worker";

    } else {

      estado.textContent =
        "⚠️ El servidor respondió pero informó un error";

    }

  }

  catch(error) {

    estado.textContent =
      "❌ Error: " +
      error.message;

  }

}

</script>

</body>
</html>
