<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>Preceptoría Digital</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}

header {
  background: #1f4e79;
  color: white;
  padding: 17px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
  opacity: .9;
}

.contenedor {
  max-width: 1050px;
  margin: auto;
  padding: 14px;
}

.tarjeta {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
  font-size: 19px;
}

h3 {
  margin-top: 0;
  font-size: 16px;
  color: #334155;
}

input,
textarea,
select {
  width: 100%;
  min-width: 0;
  padding: 11px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 85px;
  resize: vertical;
}

label {
  display: block;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 5px;
}

button {
  padding: 11px 16px;
  border: 0;
  border-radius: 7px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.btn-azul {
  background: #1f4e79;
  color: white;
}

.btn-verde {
  background: #2e7d32;
  color: white;
}

.btn-gris {
  background: #64748b;
  color: white;
}

.btn-naranja {
  background: #c46a00;
  color: white;
}


/* ======================================================
   MÓDULOS PRINCIPALES
====================================================== */

.accesos-principales {
  display: grid;
  grid-template-columns:
    repeat(3, minmax(0, 1fr));
  gap: 10px;
}

.accesos-principales button {
  min-height: 62px;
  font-size: 14px;
}


/* ======================================================
   BUSCADOR
====================================================== */

.busqueda {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.busqueda input {
  flex: 1;
  min-width: 220px;
}


/* ======================================================
   RESULTADOS
====================================================== */

.resultado {
  padding: 13px 5px;
  border-bottom: 1px solid #e5e7eb;
}

.resultado strong {
  display: block;
  margin-bottom: 4px;
}

.resultado small {
  color: #64748b;
}

.resultado-acciones {
  display: flex;
  gap: 6px;
  margin-top: 8px;
  flex-wrap: wrap;
}

.resultado-acciones button {
  padding: 7px 10px;
  font-size: 13px;
}


/* ======================================================
   FORMULARIOS
====================================================== */

.grupo {
  margin-top: 25px;
  padding-top: 17px;
  border-top: 1px solid #e5e7eb;
}

.grid {
  display: grid;
  grid-template-columns:
    repeat(2, minmax(0,1fr));
  gap: 13px;
}

.acciones {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 9px;
  flex-wrap: wrap;
}

.planilla-destino {
  background: #f8fafc;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
  border: 1px solid #e2e8f0;
}


/* ======================================================
   MENSAJES
====================================================== */

.mensaje {
  display: none;
  padding: 11px;
  margin-top: 13px;
  border-radius: 7px;
  text-align: center;
}

.exito {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.cargando {
  display: block;
  background: #dbeafe;
  color: #1e3a8a;
}

.oculto {
  display: none !important;
}


/* ======================================================
   PREVIAS
====================================================== */

.alumno-seleccionado {
  background: #eff6ff;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 15px;
}

.previa-card {
  border: 1px solid #e5e7eb;
  border-radius: 9px;
  padding: 12px;
  margin-top: 10px;
}

.previa-card strong {
  display: block;
  margin-bottom: 4px;
}

.previa-card small {
  color: #64748b;
}


/* ======================================================
   CELULAR
====================================================== */

@media(max-width:650px) {

  .contenedor {
    padding: 7px;
  }

  .tarjeta {
    padding: 13px;
  }

  .accesos-principales {
    grid-template-columns: 1fr 1fr;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .busqueda {
    display: block;
  }

  .busqueda button {
    width: 100%;
    margin-top: 8px;
  }

  .acciones button {
    width: 100%;
  }

  .resultado-acciones button {
    width: 100%;
  }

}

@media(max-width:420px) {

  .accesos-principales {
    grid-template-columns: 1fr;
  }

}

</style>

</head>


<body>


<header>

  <h1>Preceptoría Digital</h1>

  <p>
    Sistema Integral Digital de Preceptoría 2026
  </p>

</header>


<div class="contenedor">


<!-- ======================================================
     MÓDULOS PRINCIPALES
====================================================== -->

<section class="tarjeta">

  <h2>Módulos</h2>

  <div class="accesos-principales">


    <button
      class="btn-azul"
      onclick="irAlumnos()">

      👤 Alumnos

    </button>


    <button
      class="btn-naranja"
      onclick="abrirModuloPrevias()">

      📚 Previas / Equivalencias

    </button>


    <button
      class="btn-verde"
      onclick="abrirFichas()">

      📋 Fichas individuales

    </button>


    <!-- ==================================================
         MÓDULOS FUTUROS
    =================================================== -->

    <button
      class="btn-gris"
      disabled>

      📝 Incidencias

    </button>


    <button
      class="btn-gris"
      disabled>

      📄 Actas / Citaciones

    </button>


    <button
      class="btn-gris"
      disabled>

      📊 Reportes

    </button>


  </div>

</section>



<!-- ======================================================
     BUSCADOR
====================================================== -->

<section
  id="seccionAlumnos"
  class="tarjeta">

  <h2>Buscar alumno</h2>


  <div class="busqueda">


    <input
      id="textoBusqueda"
      type="text"
      placeholder="DNI, apellido o nombre"
      onkeydown="
        if(event.key === 'Enter') {
          buscar();
        }
      "
    >


    <button
      id="btnBuscar"
      class="btn-azul"
      onclick="buscar()">

      Buscar

    </button>


    <button
      class="btn-verde"
      onclick="nuevoAlumno()">

      + Nuevo alumno

    </button>


  </div>


  <div
    id="mensajeBusqueda"
    class="mensaje">
  </div>


  <div id="resultados"></div>


</section>



<!-- ======================================================
     FORMULARIO BASE_ALUMNOS
====================================================== -->

<section
  id="panelFormulario"
  class="tarjeta oculto">


  <h2 id="tituloFormulario">
    Datos del alumno
  </h2>


  <input
    type="hidden"
    id="filaAlumno">


  <input
    type="hidden"
    id="sheetIdAlumno">


  <!-- ==================================================
       SOLO PARA ALUMNOS NUEVOS
  =================================================== -->

  <div
    id="bloquePlanillaDestino"
    class="planilla-destino oculto">


    <label>
      Planilla / Preceptor destino
    </label>


    <select id="selectorPlanilla">

      <option value="">
        Seleccionar...
      </option>

    </select>


  </div>


  <div id="formulario"></div>


  <div
    id="mensajeGuardar"
    class="mensaje">
  </div>


  <div class="acciones">


    <button
      id="btnGuardar"
      class="btn-verde"
      onclick="guardar()">

      Guardar

    </button>


    <button
      class="btn-gris"
      onclick="nuevoAlumno()">

      Limpiar / Nuevo

    </button>


    <button
      class="btn-gris"
      onclick="cerrarFormulario()">

      Cerrar

    </button>


  </div>


</section>



<!-- ======================================================
     PREVIAS / EQUIVALENCIAS
====================================================== -->

<section
  id="panelPrevias"
  class="tarjeta oculto">


  <h2>
    Previas / Equivalencias
  </h2>


  <div
    id="datosAlumnoPrevias"
    class="alumno-seleccionado">
  </div>


  <button
    class="btn-verde"
    onclick="nuevaPrevia()">

    + Agregar materia

  </button>


  <div
    id="mensajePrevias"
    class="mensaje">
  </div>


  <div id="listaPrevias"></div>


  <div class="acciones">

    <button
      class="btn-gris"
      onclick="cerrarPrevias()">

      Cerrar

    </button>

  </div>


</section>



<!-- ======================================================
     FORMULARIO PREVIA
====================================================== -->

<section
  id="panelFormularioPrevia"
  class="tarjeta oculto">


  <h2 id="tituloPrevia">
    Nueva Previa / Equivalencia
  </h2>


  <input
    type="hidden"
    id="filaPrevia">


  <div class="grid">


    <div>

      <label>
        DNI alumno
      </label>

      <input
        id="previaDni"
        readonly>

    </div>


    <div>

      <label>
        Alumno
      </label>

      <input
        id="previaAlumno"
        readonly>

    </div>


    <div>

      <label>
        Curso actual
      </label>

      <input
        id="previaCursoActual"
        readonly>

    </div>


    <div>

      <label>
        División actual
      </label>

      <input
        id="previaDivisionActual"
        readonly>

    </div>


    <div>

      <label>
        Orientación actual
      </label>

      <input
        id="previaOrientacionActual"
        readonly>

    </div>


    <div>

      <label>
        Materia *
      </label>

      <input
        id="previaMateria">

    </div>


    <div>

      <label>
        Curso de la materia
      </label>

      <input
        id="previaCursoMateria"
        placeholder="Ej.: 3ero">

    </div>


    <div>

      <label>
        Condición *
      </label>


      <select id="previaCondicion">

        <option value="">
          Seleccionar
        </option>

        <option value="Previa">
          Previa
        </option>

        <option value="Equivalencia">
          Equivalencia
        </option>

      </select>

    </div>


    <div>

      <label>
        Estado *
      </label>


      <select
        id="previaEstado"
        onchange="actualizarEstadoPrevia()">


        <option value="">
          Seleccionar
        </option>


        <option value="Pendiente">
          Pendiente
        </option>


        <option value="Aprobada">
          Aprobada
        </option>


      </select>

    </div>


    <div>

      <label>
        Fecha de aprobación
      </label>

      <input
        id="previaFecha"
        type="date">

    </div>


    <div>

      <label>
        Nota
      </label>

      <input
        id="previaNota"
        type="text"
        inputmode="decimal">

    </div>


    <div>

      <label>
        Libro
      </label>

      <input
        id="previaLibro">

    </div>


    <div>

      <label>
        Folio
      </label>

      <input
        id="previaFolio">

    </div>


    <div
      style="grid-column:1/-1;">

      <label>
        Observaciones
      </label>

      <textarea
        id="previaObservaciones">
      </textarea>

    </div>


  </div>


  <div
    id="mensajeGuardarPrevia"
    class="mensaje">
  </div>


  <div class="acciones">


    <button
      id="btnGuardarPrevia"
      class="btn-verde"
      onclick="guardarPrevia()">

      Guardar

    </button>


    <button
      class="btn-gris"
      onclick="cerrarFormularioPrevia()">

      Cancelar

    </button>


  </div>


</section>


</div>


<script>


/*********************************************************
 * CLOUDFLARE WORKER
 *********************************************************/

const API_URL =
  "https://plain-voice-2149.syncroapp79.workers.dev";


/*********************************************************
 * FICHAS INDIVIDUALES
 *********************************************************/

const URL_FICHAS =
  "https://syncroapp79-hub.github.io/fichas/";


let CAMPOS = [];

let PLANILLAS = [];

let ALUMNO_ACTUAL = null;



/*********************************************************
 * CAMPOS BASE_ALUMNOS
 *********************************************************/

const GRUPOS = [


{
  titulo: "Identificación",

  campos: [
    "MatriculaNro",
    "NroLegajo",
    "AñoLectivo",
    "DNIAlumno",
    "ApellidoNombreAlumno",
    "Sexo",
    "FechaNacAlumno",
    "LugarNacAlumno",
    "NacionalidadAlumno",
    "CUILAlumno"
  ]
},


{
  titulo: "Situación escolar",

  campos: [
    "LibroMatriz",
    "FolioMatriz",
    "CursoActual",
    "Division",
    "Orientacion",
    "TurnoActual",
    "EstadoAlumno",
    "Año_Inicio_Nivel_Sec",
    "Año_Finaliz_Nivel_Sec"
  ]
},


{
  titulo: "Domicilio",

  campos: [
    "DomicilioAlumno",
    "BarrioAlumno",
    "LocalidadAlumno"
  ]
},


{
  titulo: "Tutor principal",

  campos: [
    "TutorPrincipal_Nombre",
    "TutorPrincipal_DNI",
    "TutorPrincipal_Tel",
    "VínculoAlumno"
  ]
},


{
  titulo: "Familia",

  campos: [
    "Madre_ApellidoNombre",
    "Madre_Tel",
    "Padre_ApellidoNombre",
    "Padre_Tel"
  ]
},


{
  titulo: "Salud",

  campos: [
    "Discapacidad",
    "TipoDiscapacidad",
    "Alergias",
    "ObservacionesSalud"
  ]
},


{
  titulo: "Documentación",

  campos: [
    "Doc_EstadoGeneral",
    "Doc_FaltantesCriticos"
  ]
},


{
  titulo: "Observaciones",

  campos: [
    "Observaciones"
  ]
}


];



const ETIQUETAS = {

  MatriculaNro:
    "N.º matrícula",

  NroLegajo:
    "N.º legajo",

  AñoLectivo:
    "Año lectivo",

  DNIAlumno:
    "DNI",

  ApellidoNombreAlumno:
    "Apellido y nombre",

  Sexo:
    "Sexo",

  FechaNacAlumno:
    "Fecha de nacimiento",

  LugarNacAlumno:
    "Lugar de nacimiento",

  NacionalidadAlumno:
    "Nacionalidad",

  LibroMatriz:
    "Libro matriz",

  FolioMatriz:
    "Folio matriz",

  CUILAlumno:
    "CUIL",

  CursoActual:
    "Curso actual",

  Division:
    "División",

  Orientacion:
    "Orientación",

  TurnoActual:
    "Turno",

  EstadoAlumno:
    "Estado alumno",

  DomicilioAlumno:
    "Domicilio",

  BarrioAlumno:
    "Barrio",

  LocalidadAlumno:
    "Localidad",

  TutorPrincipal_Nombre:
    "Tutor principal",

  TutorPrincipal_DNI:
    "DNI tutor",

  TutorPrincipal_Tel:
    "Teléfono tutor",

  "VínculoAlumno":
    "Vínculo",

  Madre_ApellidoNombre:
    "Madre",

  Madre_Tel:
    "Teléfono madre",

  Padre_ApellidoNombre:
    "Padre",

  Padre_Tel:
    "Teléfono padre",

  Discapacidad:
    "Discapacidad",

  TipoDiscapacidad:
    "Tipo discapacidad",

  Alergias:
    "Alergias",

  ObservacionesSalud:
    "Observaciones salud",

  Doc_EstadoGeneral:
    "Estado documentación",

  Doc_FaltantesCriticos:
    "Faltantes críticos",

  Año_Inicio_Nivel_Sec:
    "Año inicio secundario",

  Año_Finaliz_Nivel_Sec:
    "Año finalización secundario",

  Observaciones:
    "Observaciones"

};



/*********************************************************
 * INICIO
 *********************************************************/

window.addEventListener(
  "load",
  iniciar
);


async function iniciar() {

  try {

    const r =
      await apiGet({
        accion:
          "config"
      });


    if (!r.ok) {

      throw new Error(
        r.mensaje
      );

    }


    CAMPOS =
      r.campos || [];


    PLANILLAS =
      r.planillas || [];


    construirFormulario();

    cargarSelectorPlanillas();

  }

  catch(error) {

    alert(
      "No se pudo cargar el sistema: " +
      error.message
    );

  }

}



/*********************************************************
 * SELECTOR DE PLANILLAS
 *********************************************************/

function cargarSelectorPlanillas() {

  const sel =
    document.getElementById(
      "selectorPlanilla"
    );


  sel.innerHTML =
    '<option value="">Seleccionar...</option>';


  PLANILLAS.forEach(
    p => {

      const op =
        document.createElement(
          "option"
        );


      op.value =
        p.id;


      op.textContent =
        p.preceptor ||
        p.nombre ||
        p.id;


      sel.appendChild(
        op
      );

    }
  );

}



/*********************************************************
 * BOTONES PRINCIPALES
 *********************************************************/

function irAlumnos() {

  const seccion =
    document.getElementById(
      "seccionAlumnos"
    );


  seccion.scrollIntoView({
    behavior:
      "smooth",
    block:
      "start"
  });


  setTimeout(
    () => {

      document
        .getElementById(
          "textoBusqueda"
        )
        .focus();

    },
    300
  );

}



function abrirModuloPrevias() {

  mensaje(
    "mensajeBusqueda",
    "Buscá el alumno para consultar, agregar o editar sus Previas / Equivalencias.",
    "cargando"
  );


  document
    .getElementById(
      "seccionAlumnos"
    )
    .scrollIntoView({
      behavior:
        "smooth",
      block:
        "start"
    });


  setTimeout(
    () => {

      document
        .getElementById(
          "textoBusqueda"
        )
        .focus();

    },
    300
  );

}



function abrirFichas() {

  window.open(
    URL_FICHAS,
    "_blank"
  );

}



/*********************************************************
 * BUSCAR
 *********************************************************/

async function buscar() {

  const texto =
    document
      .getElementById(
        "textoBusqueda"
      )
      .value
      .trim();


  if (!texto) {

    mensaje(
      "mensajeBusqueda",
      "Ingresá DNI, apellido o nombre.",
      "error"
    );

    return;

  }


  bloquear(
    "btnBuscar",
    true,
    "Buscando..."
  );


  mensaje(
    "mensajeBusqueda",
    "Buscando...",
    "cargando"
  );


  try {

    const datos =
      await apiGet({

        accion:
          "buscar",

        q:
          texto

      });


    if (!datos.ok) {

      throw new Error(
        datos.mensaje
      );

    }


    limpiarMensaje(
      "mensajeBusqueda"
    );


    mostrarResultados(
      datos.resultados || []
    );

  }

  catch(error) {

    mensaje(
      "mensajeBusqueda",
      error.message,
      "error"
    );

  }

  finally {

    bloquear(
      "btnBuscar",
      false,
      "Buscar"
    );

  }

}



/*********************************************************
 * RESULTADOS
 *********************************************************/

function mostrarResultados(
  lista
) {

  const cont =
    document.getElementById(
      "resultados"
    );


  cont.innerHTML =
    "";


  if (!lista.length) {

    cont.innerHTML =
      "<p>No se encontraron alumnos.</p>";

    return;

  }


  lista.forEach(
    a => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "resultado";


      div.innerHTML = `

        <strong>
          ${escapar(
            a.alumno || ""
          )}
        </strong>


        <small>

          DNI:
          ${escapar(
            a.dni || ""
          )}

          |

          ${escapar(
            a.curso || ""
          )}

          ${escapar(
            a.division || ""
          )}

        </small>


        <br>


        <small>

          Preceptor:
          ${escapar(
            a.preceptor ||
            a.planilla ||
            ""
          )}

        </small>


        <div
          class="resultado-acciones">


          <button
            class="btn-azul"
            onclick="
              abrirAlumno(
                '${escaparJS(
                  a.sheetId
                )}',
                ${a.fila}
              )
            ">

            Editar datos

          </button>


          <button
            class="btn-naranja"
            onclick="
              abrirPrevias(
                '${escaparJS(
                  a.sheetId
                )}',
                ${a.fila}
              )
            ">

            Previas / Equivalencias

          </button>


          <button
            class="btn-verde"
            onclick="abrirFichas()">

            📋 Fichas

          </button>


        </div>

      `;


      cont.appendChild(
        div
      );

    }
  );

}



/*********************************************************
 * OBTENER ALUMNO
 *********************************************************/

async function obtenerAlumnoPorFila(
  sheetId,
  fila
) {

  const datos =
    await apiGet({

      accion:
        "alumno",

      sheetId:
        sheetId,

      fila:
        fila

    });


  if (!datos.ok) {

    throw new Error(
      datos.mensaje
    );

  }


  return datos;

}



/*********************************************************
 * ABRIR ALUMNO
 *********************************************************/

async function abrirAlumno(
  sheetId,
  fila
) {

  try {

    const datos =
      await obtenerAlumnoPorFila(
        sheetId,
        fila
      );


    ALUMNO_ACTUAL =
      datos.alumno;


    ALUMNO_ACTUAL._sheetId =
      datos.sheetId;


    ALUMNO_ACTUAL._fila =
      datos.fila;


    ALUMNO_ACTUAL._preceptor =
      datos.preceptor;


    llenarFormulario(

  }

  catch(error) {

      error.message,
      "error"
    );

  }

}

async function cargarPrevias() {

    !ALUMNO_ACTUAL ||
    !ALUMNO_ACTUAL.DNIAlumno
  ) {

    return;

  }


  mensaje(
    "mensajePrevias",
    "Cargando...",

  try {

      await apiGet({

        accion:

/*********************************************************

 *********************************************************/

function construirFormulario() {

  const cont =
    document.getElementById(
      "formulario"
    );


  cont.innerHTML =
    "";


  GRUPOS.forEach(
    grupo => {

      const disponibles =
        grupo.campos.filter(
          c =>
            CAMPOS.includes(
              c
            )
        );


      if (!disponibles.length) {

        return;

      }


      const bloque =
        document.createElement(
          "div"
        );


      bloque.className =
        "grupo";


      const titulo =
        document.createElement(
          "h3"
        );


      titulo.textContent =
        grupo.titulo;


      bloque.appendChild(
        titulo
      );


      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "grid";


      disponibles.forEach(
        campo => {

          grid.appendChild(
            crearCampo(
              campo
            )
          );

        }
      );


      bloque.appendChild(
        grid
      );


      cont.appendChild(
        bloque
      );

    }
  );

}



/*********************************************************
 * CREAR CAMPO
 *********************************************************/

function crearCampo(
  nombre
) {

  const div =
    document.createElement(
      "div"
    );


  const label =
    document.createElement(
      "label"
    );


  label.textContent =
    ETIQUETAS[nombre] ||
    nombre;


  let control;


  if (
    nombre ===
      "Observaciones"
    ||
    nombre ===
      "ObservacionesSalud"
  ) {

    control =
      document.createElement(
        "textarea"
      );

  }

  else {

    control =
      document.createElement(
        "input"
      );


    control.type =
      nombre ===
        "FechaNacAlumno"
        ? "date"
        : "text";

  }


  control.id =
    "campo_" +
    nombre;


  control.dataset.campo =
    nombre;


  div.appendChild(
    label
  );


  div.appendChild(
    control
  );


  return div;

}

/*********************************************************
 * GUARDAR ALUMNO
 *********************************************************/

async function guardar() {

  const campos = {};


  CAMPOS.forEach(
    nombre => {

      const input =
        document.getElementById(
          "campo_" +
          nombre
        );


      if (!input) {

        return;

      }


      campos[nombre] =
        input.value.trim();

    }
  );


  if (!campos.DNIAlumno) {

    mensaje(
      "mensajeGuardar",
      "El DNI es obligatorio.",
      "error"
    );

    return;

  }


  if (
    !campos
      .ApellidoNombreAlumno
  ) {

    mensaje(
      "mensajeGuardar",
      "Apellido y nombre es obligatorio.",
      "error"
    );

    return;

  }


  let sheetId =
    document
      .getElementById(
        "sheetIdAlumno"
      )
      .value;


  const fila =
    document
      .getElementById(
        "filaAlumno"
      )
      .value;


  /*
   * ALUMNO NUEVO
   */

  if (!fila) {

    sheetId =
      document
        .getElementById(
          "selectorPlanilla"
        )
        .value;


    if (!sheetId) {

      mensaje(
        "mensajeGuardar",
        "Seleccioná la planilla / preceptor destino.",
        "error"
      );

      return;

    }

  }


  bloquear(
    "btnGuardar",
    true,
    "Guardando..."
  );


  try {

    const r =
      await apiPost({


        accion:
          "guardar",


        usuario:
          "Panel Preceptoría",


        sheetId:
          sheetId,


        fila:
          fila,


        campos:
          campos


      });


    if (!r.ok) {

      throw new Error(
        r.mensaje
      );

    }


    document
      .getElementById(
        "filaAlumno"
      )
      .value =
        r.fila;


    document
      .getElementById(
        "sheetIdAlumno"
      )
      .value =
        r.sheetId;


    document
      .getElementById(
        "bloquePlanillaDestino"
      )
      .classList
      .add(
        "oculto"
      );


    mensaje(
      "mensajeGuardar",

      r.mensaje +
      (
        r.preceptor
          ? " | " +
            r.preceptor
          : ""
      ),

      "exito"
    );

  }

  catch(error) {

    mensaje(
      "mensajeGuardar",
      error.message,
      "error"
    );

  }

  finally {

    bloquear(
      "btnGuardar",
      false,
      "Guardar"
    );

  }

}



/*********************************************************
 * API GET
 *********************************************************/

async function apiGet(
  params
) {

  const url =
    new URL(
      API_URL
    );


  Object.entries(
    params
  )
  .forEach(
    ([k,v]) => {

      url.searchParams
        .set(
          k,
          v
        );

    }
  );


  const r =
    await fetch(
      url.toString(),
      {
        cache:
          "no-store"
      }
    );


  const texto =
    await r.text();


  return JSON.parse(
    texto
  );

}



/*********************************************************
 * API POST
 *********************************************************/

async function apiPost(
  datos
) {

  const r =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify(
            datos
          )

      }
    );


  const texto =
    await r.text();


  return JSON.parse(
    texto
  );

}

function fechaHtml(
  valor
) {

  const s =
    String(
      valor || ""
    )
    .trim();


  let m =
    s.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


  if (m) {

    return (
      m[3]
      + "-"
      + m[2].padStart(
          2,
          "0"
        )
      + "-"
      + m[1].padStart(
          2,
          "0"
        )
    );

  }


  if (
    /^\d{4}-\d{2}-\d{2}$/
      .test(
        s
      )
  ) {

    return s;

  }


  return "";

}



function escapar(
  valor
) {

  return String(
    valor || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



function escaparJS(
  valor
) {

  return String(
    valor || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}
