<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Prueba Cloudflare</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #f4f7fb;
    }

    .caja {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #1f4e79;
      color: white;
      border: 0;
      border-radius: 7px;
      font-size: 16px;
    }

    #estado {
      margin-top: 20px;
      padding: 12px;
      background: #eee;
      border-radius: 7px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<div class="caja">

  <h2>Prueba Cloudflare Worker</h2>

  <button onclick="probar()">
    Probar conexión
  </button>

  <div id="estado">
    Esperando prueba...
  </div>

</div>


<script>

const API_URL =
  "https://plain-voice-2149.syncroapp79.workers.dev";


async function probar() {

  const estado =
    document.getElementById("estado");


  estado.textContent =
    "Conectando a: " + API_URL;


  try {

    const respuesta =
      await fetch(
        API_URL,
        {
          method: "GET",
          mode: "cors",
          cache: "no-store"
        }
      );


    const texto =
      await respuesta.text();


    console.log(
      "RESPUESTA CRUDA:",
      texto
    );


    let datos;


    try {

      datos =
        JSON.parse(texto);

    }

    catch(error) {

      estado.textContent =
        "La respuesta NO es JSON:\n\n" +
        texto.substring(0, 500);

      return;

    }


    if (datos.ok) {

      estado.textContent =
        "✅ CONEXIÓN CORRECTA\n\n" +
        JSON.stringify(
          datos,
          null,
          2
        );

    }

    else {

      estado.textContent =
        "⚠️ Respondió el Worker:\n\n" +
        JSON.stringify(
          datos,
          null,
          2
        );

    }

  }

  catch(error) {

    estado.textContent =
      "❌ ERROR FETCH:\n\n" +
      error.message;

    console.error(error);

  }

}

</script>

</body>

</html>
