<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1">

<title>Preceptoría Digital</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #1f2937;
}

header {
  background: #1f4e79;
  color: white;
  padding: 17px;
}

header h1 {
  margin: 0;
  font-size: 22px;
}

header p {
  margin: 5px 0 0;
  font-size: 13px;
  opacity: .9;
}

.contenedor {
  max-width: 1050px;
  margin: auto;
  padding: 14px;
}

.tarjeta {
  background: white;
  padding: 18px;
  border-radius: 12px;
  margin-bottom: 15px;
  box-shadow: 0 4px 15px rgba(0,0,0,.07);
}

h2 {
  margin-top: 0;
  font-size: 19px;
}

h3 {
  margin-top: 0;
  font-size: 16px;
  color: #334155;
}

input,
textarea,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  font-size: 16px;
  background: white;
}

textarea {
  min-height: 80px;
}

label {
  display: block;
  font-weight: bold;
  font-size: 13px;
  margin-bottom: 5px;
}

button {
  padding: 11px 16px;
  border: 0;
  border-radius: 7px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: .45;
  cursor: not-allowed;
}

.btn-azul {
  background: #1f4e79;
  color: white;
}

.btn-verde {
  background: #2e7d32;
  color: white;
}

.btn-naranja {
  background: #c46a00;
  color: white;
}

.btn-gris {
  background: #64748b;
  color: white;
}


/* ======================================================
   MÓDULOS
====================================================== */

.modulos {
  display: grid;
  grid-template-columns:
    repeat(auto-fit, minmax(170px,1fr));
  gap: 10px;
}

.modulos button {
  min-height: 64px;
}


/* ======================================================
   BUSCADOR
====================================================== */

.busqueda {
  display: flex;
  gap: 8px;
}

.busqueda input {
  flex: 1;
}


/* ======================================================
   RESULTADOS
====================================================== */

.resultado {
  padding: 12px 4px;
  border-bottom: 1px solid #e5e7eb;
}

.resultado strong {
  display: block;
}

.resultado small {
  color: #64748b;
}

.resultado-acciones {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.resultado-acciones button {
  padding: 7px 10px;
  font-size: 13px;
}


/* ======================================================
   PREVIAS POR CURSO
====================================================== */

.selector-curso {
  background: #f8fafc;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
}

.resumen-curso {
  margin-top: 12px;
  font-size: 14px;
  color: #475569;
}


/*
 * MISMA LÓGICA QUE FICHAS:
 * altura fija + barra vertical.
 */

.lista-alumnos-scroll {
  max-height: 470px;
  overflow-y: auto;
  margin-top: 15px;
  border: 1px solid #e5e7eb;
  border-radius: 9px;
  background: white;
}

.alumno-previas {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-bottom: 1px solid #e5e7eb;
}

.alumno-previas:last-child {
  border-bottom: none;
}

.alumno-previas-info {
  min-width: 0;
  flex: 1;
}

.alumno-previas-info strong {
  display: block;
}

.alumno-previas-info small {
  display: block;
  color: #64748b;
  margin-top: 3px;
}


/* ======================================================
   PREVIAS DE UN ALUMNO
====================================================== */

.alumno-seleccionado {
  background: #eff6ff;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 12px;
}

.lista-previas-scroll {
  max-height: 350px;
  overflow-y: auto;
  margin-top: 12px;
}

.previa-card {
  border: 1px solid #e5e7eb;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 8px;
}

.previa-card strong {
  display: block;
}

.previa-card small {
  color: #64748b;
}


/* ======================================================
   FORMULARIOS
====================================================== */

.grid {
  display: grid;
  grid-template-columns:
    repeat(2,minmax(0,1fr));
  gap: 13px;
}

.grupo {
  margin-top: 22px;
  padding-top: 15px;
  border-top: 1px solid #e5e7eb;
}

.acciones {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 18px;
}

.planilla-destino {
  padding: 12px;
  border: 1px solid #e2e8f0;
  background: #f8fafc;
  border-radius: 8px;
}


/* ======================================================
   MENSAJES
====================================================== */

.mensaje {
  display: none;
  margin-top: 12px;
  padding: 10px;
  border-radius: 7px;
  text-align: center;
}

.exito {
  display: block;
  background: #dcfce7;
  color: #166534;
}

.error {
  display: block;
  background: #fee2e2;
  color: #991b1b;
}

.cargando {
  display: block;
  background: #dbeafe;
  color: #1e3a8a;
}

.oculto {
  display: none !important;
}


/* ======================================================
   CELULAR
====================================================== */

@media(max-width:650px) {

  .contenedor {
    padding: 7px;
  }

  .tarjeta {
    padding: 13px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .busqueda {
    display: block;
  }

  .busqueda button {
    width: 100%;
    margin-top: 8px;
  }

  .alumno-previas {
    align-items: center;
  }

  .alumno-previas button {
    flex-shrink: 0;
  }

  .lista-alumnos-scroll {
    max-height: 430px;
  }

}

</style>

</head>


<body>


<header>

  <h1>
    Preceptoría Digital
  </h1>

  <p>
    Sistema Integral Digital de Preceptoría 2026
  </p>

</header>


<div class="contenedor">


<!-- ======================================================
     MÓDULOS
====================================================== -->

<section class="tarjeta">

  <h2>Módulos</h2>

  <div class="modulos">


    <button
      class="btn-azul"
      onclick="irAlumnos()">

      👤 Alumnos

    </button>


    <button
      class="btn-naranja"
      onclick="abrirModuloPrevias()">

      📚 Previas / Equivalencias

    </button>


    <button
      class="btn-verde"
      onclick="abrirFichas()">

      📋 Fichas individuales

    </button>


    <button
      class="btn-gris"
      disabled>

      📄 Boletín de inasistencia

    </button>


    <button
      class="btn-gris"
      disabled>

      🧾 Boletín de calificaciones

    </button>


    <button
      class="btn-gris"
      disabled>

      📊 Centralizadora

    </button>


  </div>

</section>



<!-- ======================================================
     ALUMNOS
====================================================== -->

<section
  id="seccionAlumnos"
  class="tarjeta">


  <h2>
    Buscar alumno
  </h2>


  <div class="busqueda">

    <input
      id="textoBusqueda"
      placeholder="DNI, apellido o nombre"
      onkeydown="
        if(event.key==='Enter'){
          buscar();
        }
      "
    >


    <button
      id="btnBuscar"
      class="btn-azul"
      onclick="buscar()">

      Buscar

    </button>


    <button
      class="btn-verde"
      onclick="nuevoAlumno()">

      + Nuevo alumno

    </button>

  </div>


  <div
    id="mensajeBusqueda"
    class="mensaje">
  </div>


  <div id="resultados"></div>


</section>



<!-- ======================================================
     PREVIAS POR CURSO
====================================================== -->

<section
  id="panelPreviasCurso"
  class="tarjeta oculto">


  <h2>
    Previas / Equivalencias
  </h2>


  <div class="selector-curso">


    <label>
      Curso y división
    </label>


    <select
      id="selectorCursoPrevias"
      onchange="cargarAlumnosCursoPrevias()">

      <option value="">
        Seleccionar...
      </option>

    </select>


    <div
      id="resumenCursoPrevias"
      class="resumen-curso">
    </div>


  </div>


  <div
    id="mensajePreviasCurso"
    class="mensaje">
  </div>


  <div
    id="listaAlumnosPrevias"
    class="lista-alumnos-scroll">
  </div>


  <div class="acciones">

    <button
      class="btn-gris"
      onclick="cerrarModuloPrevias()">

      Cerrar

    </button>

  </div>


</section>



<!-- ======================================================
     PREVIAS DEL ALUMNO
====================================================== -->

<section
  id="panelPrevias"
  class="tarjeta oculto">


  <h2>
    Previas / Equivalencias del alumno
  </h2>


  <div
    id="datosAlumnoPrevias"
    class="alumno-seleccionado">
  </div>


  <button
    class="btn-verde"
    onclick="nuevaPrevia()">

    + Agregar materia

  </button>


  <div
    id="mensajePrevias"
    class="mensaje">
  </div>


  <div
    id="listaPrevias"
    class="lista-previas-scroll">
  </div>


  <div class="acciones">

    <button
      class="btn-gris"
      onclick="cerrarPrevias()">

      Volver al curso

    </button>

  </div>


</section>



<!-- ======================================================
     FORMULARIO PREVIA
====================================================== -->

<section
  id="panelFormularioPrevia"
  class="tarjeta oculto">


  <h2 id="tituloPrevia">
    Nueva Previa / Equivalencia
  </h2>


  <input
    id="filaPrevia"
    type="hidden">


  <div class="grid">


    <div>
      <label>DNI</label>
      <input
        id="previaDni"
        readonly>
    </div>


    <div>
      <label>Alumno</label>
      <input
        id="previaAlumno"
        readonly>
    </div>


    <div>
      <label>Curso actual</label>
      <input
        id="previaCursoActual"
        readonly>
    </div>


    <div>
      <label>División actual</label>
      <input
        id="previaDivisionActual"
        readonly>
    </div>


    <div>
      <label>Orientación</label>
      <input
        id="previaOrientacionActual"
        readonly>
    </div>


    <div>
      <label>Materia *</label>
      <input id="previaMateria">
    </div>


    <div>

      <label>
        Curso de la materia
      </label>

      <input
        id="previaCursoMateria"
        placeholder="Ej.: 3ero">

    </div>


    <div>

      <label>
        Condición *
      </label>

      <select id="previaCondicion">

        <option value="">
          Seleccionar
        </option>

        <option value="Previa">
          Previa
        </option>

        <option value="Equivalencia">
          Equivalencia
        </option>

      </select>

    </div>


    <div>

      <label>
        Estado *
      </label>

      <select
        id="previaEstado"
        onchange="actualizarEstadoPrevia()">

        <option value="">
          Seleccionar
        </option>

        <option value="Pendiente">
          Pendiente
        </option>

        <option value="Aprobada">
          Aprobada
        </option>

      </select>

    </div>


    <div>

      <label>
        Fecha de aprobación
      </label>

      <input
        id="previaFecha"
        type="date">

    </div>


    <div>
      <label>Nota</label>
      <input id="previaNota">
    </div>


    <div>
      <label>Libro</label>
      <input id="previaLibro">
    </div>


    <div>
      <label>Folio</label>
      <input id="previaFolio">
    </div>


    <div style="grid-column:1/-1;">

      <label>
        Observaciones
      </label>

      <textarea
        id="previaObservaciones">
      </textarea>

    </div>


  </div>


  <div
    id="mensajeGuardarPrevia"
    class="mensaje">
  </div>


  <div class="acciones">


    <button
      id="btnGuardarPrevia"
      class="btn-verde"
      onclick="guardarPrevia()">

      Guardar

    </button>


    <button
      class="btn-gris"
      onclick="cerrarFormularioPrevia()">

      Cancelar

    </button>


  </div>


</section>



<!-- ======================================================
     FORMULARIO ALUMNO
====================================================== -->

<section
  id="panelFormulario"
  class="tarjeta oculto">


  <h2 id="tituloFormulario">
    Datos del alumno
  </h2>


  <input
    id="filaAlumno"
    type="hidden">


  <input
    id="sheetIdAlumno"
    type="hidden">


  <div
    id="bloquePlanillaDestino"
    class="planilla-destino oculto">


    <label>
      Planilla / Preceptor destino
    </label>


    <select id="selectorPlanilla">

      <option value="">
        Seleccionar...
      </option>

    </select>


  </div>


  <div id="formulario"></div>


  <div
    id="mensajeGuardar"
    class="mensaje">
  </div>


  <div class="acciones">


    <button
      id="btnGuardar"
      class="btn-verde"
      onclick="guardar()">

      Guardar

    </button>


    <button
      class="btn-gris"
      onclick="nuevoAlumno()">

      Limpiar / Nuevo

    </button>


    <button
      class="btn-gris"
      onclick="cerrarFormulario()">

      Cerrar

    </button>


  </div>


</section>


</div>


<script>


/*********************************************************
 * CONFIG
 *********************************************************/

const API_URL =
  "https://plain-voice-2149.syncroapp79.workers.dev";


const URL_FICHAS =
  "https://syncroapp79-hub.github.io/fichas/";


let CAMPOS = [];

let PLANILLAS = [];

let CURSOS_PREVIAS = [];

let ALUMNO_ACTUAL = null;



/*********************************************************
 * CAMPOS
 *********************************************************/

const GRUPOS = [

{
  titulo: "Identificación",

  campos: [
    "MatriculaNro",
    "NroLegajo",
    "AñoLectivo",
    "DNIAlumno",
    "ApellidoNombreAlumno",
    "Sexo",
    "FechaNacAlumno",
    "LugarNacAlumno",
    "NacionalidadAlumno",
    "CUILAlumno"
  ]
},

{
  titulo: "Situación escolar",

  campos: [
    "LibroMatriz",
    "FolioMatriz",
    "CursoActual",
    "Division",
    "Orientacion",
    "TurnoActual",
    "EstadoAlumno",
    "Año_Inicio_Nivel_Sec",
    "Año_Finaliz_Nivel_Sec"
  ]
},

{
  titulo: "Domicilio",

  campos: [
    "DomicilioAlumno",
    "BarrioAlumno",
    "LocalidadAlumno"
  ]
},

{
  titulo: "Tutor principal",

  campos: [
    "TutorPrincipal_Nombre",
    "TutorPrincipal_DNI",
    "TutorPrincipal_Tel",
    "VínculoAlumno"
  ]
},

{
  titulo: "Familia",

  campos: [
    "Madre_ApellidoNombre",
    "Madre_Tel",
    "Padre_ApellidoNombre",
    "Padre_Tel"
  ]
},

{
  titulo: "Salud",

  campos: [
    "Discapacidad",
    "TipoDiscapacidad",
    "Alergias",
    "ObservacionesSalud"
  ]
},

{
  titulo: "Documentación",

  campos: [
    "Doc_EstadoGeneral",
    "Doc_FaltantesCriticos"
  ]
},

{
  titulo: "Observaciones",

  campos: [
    "Observaciones"
  ]
}

];


const ETIQUETAS = {

MatriculaNro: "N.º matrícula",
NroLegajo: "N.º legajo",
AñoLectivo: "Año lectivo",
DNIAlumno: "DNI",
ApellidoNombreAlumno: "Apellido y nombre",
Sexo: "Sexo",
FechaNacAlumno: "Fecha de nacimiento",
LugarNacAlumno: "Lugar de nacimiento",
NacionalidadAlumno: "Nacionalidad",
LibroMatriz: "Libro matriz",
FolioMatriz: "Folio matriz",
CUILAlumno: "CUIL",
CursoActual: "Curso actual",
Division: "División",
Orientacion: "Orientación",
TurnoActual: "Turno",
EstadoAlumno: "Estado alumno",
DomicilioAlumno: "Domicilio",
BarrioAlumno: "Barrio",
LocalidadAlumno: "Localidad",
TutorPrincipal_Nombre: "Tutor principal",
TutorPrincipal_DNI: "DNI tutor",
TutorPrincipal_Tel: "Teléfono tutor",
"VínculoAlumno": "Vínculo",
Madre_ApellidoNombre: "Madre",
Madre_Tel: "Teléfono madre",
Padre_ApellidoNombre: "Padre",
Padre_Tel: "Teléfono padre",
Discapacidad: "Discapacidad",
TipoDiscapacidad: "Tipo discapacidad",
Alergias: "Alergias",
ObservacionesSalud: "Observaciones salud",
Doc_EstadoGeneral: "Estado documentación",
Doc_FaltantesCriticos: "Faltantes críticos",
Año_Inicio_Nivel_Sec: "Año inicio secundario",
Año_Finaliz_Nivel_Sec: "Año finalización secundario",
Observaciones: "Observaciones"

};



/*********************************************************
 * INICIO
 *********************************************************/

window.addEventListener(
  "load",
  iniciar
);


async function iniciar() {

  try {

    const r =
      await apiGet({
        accion: "config"
      });


    if (!r.ok) {

      throw new Error(
        r.mensaje
      );

    }


    CAMPOS =
      r.campos || [];


    PLANILLAS =
      r.planillas || [];


    construirFormulario();

    cargarSelectorPlanillas();

  }

  catch(error) {

    alert(
      "No se pudo cargar el sistema: " +
      error.message
    );

  }

}



/*********************************************************
 * MÓDULOS
 *********************************************************/

function irAlumnos() {

  document
    .getElementById(
      "seccionAlumnos"
    )
    .scrollIntoView({
      behavior: "smooth"
    });

}



function abrirFichas() {

  window.open(
    URL_FICHAS,
    "_blank"
  );

}



/*********************************************************
 * MÓDULO PREVIAS
 *********************************************************/

async function abrirModuloPrevias() {

  document
    .getElementById(
      "panelPreviasCurso"
    )
    .classList
    .remove(
      "oculto"
    );


  document
    .getElementById(
      "panelPreviasCurso"
    )
    .scrollIntoView({
      behavior: "smooth"
    });


  if (
    CURSOS_PREVIAS.length
  ) {

    return;

  }


  mensaje(
    "mensajePreviasCurso",
    "Cargando cursos...",
    "cargando"
  );


  try {

    const r =
      await apiGet({

        accion:
          "obtenerCursosPrevias"

      });


    if (!r.ok) {

      throw new Error(
        r.mensaje
      );

    }


    CURSOS_PREVIAS =
      r.cursos || [];


    cargarSelectorCursosPrevias();


    limpiarMensaje(
      "mensajePreviasCurso"
    );

  }

  catch(error) {

    mensaje(
      "mensajePreviasCurso",
      error.message,
      "error"
    );

  }

}



/*********************************************************
 * SELECTOR CURSO PREVIAS
 *********************************************************/

function cargarSelectorCursosPrevias() {

  const sel =
    document.getElementById(
      "selectorCursoPrevias"
    );


  sel.innerHTML =
    '<option value="">Seleccionar...</option>';


  CURSOS_PREVIAS.forEach(
    (c, index) => {

      const op =
        document.createElement(
          "option"
        );


      op.value =
        index;


      op.textContent =
        c.etiqueta;


      sel.appendChild(
        op
      );

    }
  );

}



/*********************************************************
 * CARGAR ALUMNOS CURSO PREVIAS
 *********************************************************/

async function cargarAlumnosCursoPrevias() {

  const valor =
    document
      .getElementById(
        "selectorCursoPrevias"
      )
      .value;


  const cont =
    document.getElementById(
      "listaAlumnosPrevias"
    );


  cont.innerHTML = "";


  document
    .getElementById(
      "resumenCursoPrevias"
    )
    .textContent = "";


  if (valor === "") {

    return;

  }


  const curso =
    CURSOS_PREVIAS[
      Number(valor)
    ];


  mensaje(
    "mensajePreviasCurso",
    "Cargando alumnos...",
    "cargando"
  );


  try {

    const r =
      await apiGet({

        accion:
          "listarAlumnosCursoPrevias",

        curso:
          curso.curso,

        division:
          curso.division

      });


    if (!r.ok) {

      throw new Error(
        r.mensaje
      );

    }


    limpiarMensaje(
      "mensajePreviasCurso"
    );


    document
      .getElementById(
        "resumenCursoPrevias"
      )
      .textContent =
        curso.etiqueta +
        " · " +
        (
          r.cantidad || 0
        ) +
        " alumnos";


    mostrarAlumnosCursoPrevias(
      r.alumnos || []
    );

  }

  catch(error) {

    mensaje(
      "mensajePreviasCurso",
      error.message,
      "error"
    );

  }

}



/*********************************************************
 * MOSTRAR ALUMNOS CURSO
 *********************************************************/

function mostrarAlumnosCursoPrevias(
  alumnos
) {

  const cont =
    document.getElementById(
      "listaAlumnosPrevias"
    );


  cont.innerHTML = "";


  if (!alumnos.length) {

    cont.innerHTML =
      "<p style='padding:12px;'>No se encontraron alumnos.</p>";

    return;

  }


  alumnos.forEach(
    a => {

      const div =
        document.createElement(
          "div"
        );


      div.className =
        "alumno-previas";


      div.innerHTML = `

        <div class="alumno-previas-info">

          <strong>
            ${escapar(
              a.alumno || ""
            )}
          </strong>

          <small>
            DNI:
            ${escapar(
              a.dni || ""
            )}
          </small>

          <small>
            Preceptor:
            ${escapar(
              a.preceptor || ""
            )}
          </small>

        )}

async function cargarPrevias() {

  if (

  mensaje(

    "Cargando...",
    "cargando"

    CursoActual:
      valor("previaCursoActual"),

      valor("previaDivisionActual"),

      valor(
        "previaOrientacionActual"
      ),

      valor("previaMateria"),

    CursoMateria:
      valor("previaCursoMateria"),

    "Condición":
      valor("previaCondicion"),

    Estado:
      valor("previaEstado"),

    FechaAprobacion:
      valor("previaFecha"),

    Nota:
      valor("previaNota"),

      valor("previaLibro"),

function construirFormulario() {

  const cont =
    document.getElementById(
      "formulario"
    );


  cont.innerHTML = "";


  GRUPOS.forEach(
    grupo => {

      const disponibles =
        grupo.campos.filter(
          c =>
            CAMPOS.includes(c)
        );


      if (!disponibles.length) {

        return;

      }


      const bloque =
        document.createElement(
          "div"
        );


      bloque.className =
        "grupo";


      const h =
        document.createElement(
          "h3"
        );


      h.textContent =
        grupo.titulo;


      bloque.appendChild(h);


      const grid =
        document.createElement(
          "div"
        );


      grid.className =
        "grid";


      disponibles.forEach(
        campo => {

          const d =
            document.createElement(
              "div"
            );


          const l =
            document.createElement(
              "label"
            );


          l.textContent =
            ETIQUETAS[campo] ||
            campo;


          let c;


          if (
            campo ===
              "Observaciones" ||
            campo ===
              "ObservacionesSalud"
          ) {

            c =
              document.createElement(
                "textarea"
              );

          }

          else {

            c =
              document.createElement(
                "input"
              );


            c.type =
              campo ===
                "FechaNacAlumno"
                ? "date"
                : "text";

          }


          c.id =
            "campo_" +
            campo;


          c.dataset.campo =
            campo;


          d.appendChild(l);

          d.appendChild(c);

          grid.appendChild(d);

        }
      );


      bloque.appendChild(
        grid
      );


      cont.appendChild(
        bloque
      );

    }
  );

}



function llenarFormulario(
  alumno,
  fila,
  sheetId
) {

  limpiarCampos();


  document

      "filaAlumno"

  document

/*********************************************************
 * API
 *********************************************************/

async function apiGet(
  params
) {

  const url =
    new URL(
      API_URL
    );


  Object.entries(
    params
  )
  .forEach(
    ([k,v]) => {

      url.searchParams
        .set(
          k,
          v
        );

    }
  );


  const r =
    await fetch(
      url.toString(),
      {
        cache:
          "no-store"
      }
    );


  return JSON.parse(
    await r.text()
  );

}



async function apiPost(
  datos
) {

  const r =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify(
            datos
          )

      }
    );


  return JSON.parse(
    await r.text()
  );

}

    "mensaje";

}



function bloquear(
  id,
  estado,
  texto
) {

  const boton =
    document.getElementById(
      id
    );


  if (!boton) {

    return;

  }


  boton.disabled =
    estado;


  boton.textContent =
    texto;

}



function fechaHtml(
  valorFecha
) {

  const s =
    String(
      valorFecha || ""
    ).trim();


  let m =
    s.match(
      /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/
    );


  if (m) {

    return (
      m[3] +
      "-" +
      m[2].padStart(
        2,
        "0"
      ) +
      "-" +
      m[1].padStart(
        2,
        "0"
      )
    );

  }


  if (
    /^\d{4}-\d{2}-\d{2}$/
      .test(s)
  ) {

    return s;

  }


  return "";

}



function escapar(valor) {

  return String(
    valor || ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}



function escaparJS(valor) {

  return String(
    valor || ""
  )
  .replace(
    /\\/g,
    "\\\\"
  )
  .replace(
    /'/g,
    "\\'"
  );

}
